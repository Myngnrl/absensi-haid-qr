
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi Haid Digital</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    /* Menu utama aplikasi */
.app-nav {
  display: flex;
  gap: 8px;
  margin: 0 auto 18px;
  max-width: 700px;
}

.app-nav button {
  flex: 1;
  padding: 13px 8px;
  border: 1px solid #d7e5dc;
  border-radius: 12px;
  background: #fff;
  color: #24533b;
  font-weight: bold;
  cursor: pointer;
}

.app-nav button.active {
  background: #176b45;
  color: #fff;
  border-color: #176b45;
}

.app-page {
  max-width: 700px;
  margin: 0 auto;
}

.app-page.hidden {
  display: none;
}

.dashboard-frame {
  width: 100%;
  height: 78vh;
  min-height: 600px;
  border: 0;
  border-radius: 14px;
  background: #fff;
}
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 24px auto;
      padding: 16px;
      background: #f5f7fb;
      color: #222;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 2px 12px #0001;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #bbb; }
    button {
      border: 0;
      background: #176b45;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    #reader { width: 100%; margin-top: 16px; }
    #status {
      margin-top: 16px;
      padding: 12px;
      background: #eef3f0;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <nav class="app-nav">
  <button
    type="button"
    id="menuScan"
    class="active"
    onclick="bukaHalaman('scan')">
    📷 Scan QR
  </button>

  <button
    type="button"
    id="menuDashboard"
    onclick="bukaHalaman('dashboard')">
    📊 Dashboard
  </button>
</nav>

<section id="scanPage" class="app-page">
  <!-- Letakkan seluruh tampilan pemindai QR lama di sini -->
</section>

<section id="dashboardPage" class="app-page hidden">
  <iframe
    class="dashboard-frame"
    title="Dashboard Absensi Haid"
    src="https://script.google.com/macros/s/AKfycbyMDHp0R61Az23eiMjSjLP_tviHFkGkD6y4d0pY3HUO-gOvVptpYPPVQKpm5e8DBdd3hw/exec"
    loading="lazy">
  </iframe>
</section>

<script>
  function bukaHalaman(halaman) {
    const scan = halaman === 'scan';

    document.getElementById('scanPage')
      .classList.toggle('hidden', !scan);

    document.getElementById('dashboardPage')
      .classList.toggle('hidden', scan);

    document.getElementById('menuScan')
      .classList.toggle('active', scan);

    document.getElementById('menuDashboard')
      .classList.toggle('active', !scan);
  }
</script>
  <div class="card">
    <h2>Absensi Haid Digital</h2>
    <p>Masukkan PIN petugas, lalu pindai QR siswi.</p>

    <label for="pin">PIN Petugas</label>
    <input id="pin" type="password"
      inputmode="numeric" autocomplete="off"
      placeholder="Masukkan PIN petugas">

    <button id="startBtn">Buka Kamera</button>
    <div id="reader"></div>
    <div id="status" role="status" aria-live="polite">
      Kamera belum dibuka.
    </div>
  </div>

  <script>
    const WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbyMDHp0R61Az23eiMjSjLP_tviHFkGkD6y4d0pY3HUO-gOvVptpYPPVQKpm5e8DBdd3hw/exec';

    let scanner = null;
    let running = false;
    let processing = false;
    let requestNonce = null;
    let timeoutId = null;
    let requestForm = null;
    let responseFrame = null;

    const statusBox = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const pinInput = document.getElementById('pin');

    function bersihkanPermintaan() {
      if (timeoutId) clearTimeout(timeoutId);
      timeoutId = null;

      if (requestForm) requestForm.remove();
      if (responseFrame) responseFrame.remove();

      requestForm = null;
      responseFrame = null;
      requestNonce = null;
      processing = false;
      startBtn.disabled = false;
    }

    window.addEventListener('message', (event) => {
      const data = event.data;

      if (
        !data ||
        data.type !== 'ABSENSI_HAID_RESULT' ||
        !requestNonce ||
        data.nonce !== requestNonce
      ) return;

      bersihkanPermintaan();

      statusBox.textContent = data.message ||
        (data.ok ? 'Absensi berhasil dicatat.' : 'Absensi gagal.');

      startBtn.textContent = 'Pindai QR Berikutnya';
    });

    async function kirimAbsensi(token) {
      processing = true;
      startBtn.disabled = true;
      statusBox.textContent = 'QR terbaca. Mengirim data...';

      try {
        if (scanner && running) {
          await scanner.stop();
          running = false;
        }

        requestNonce = (
          Date.now().toString(36) +
          Math.random().toString(36).slice(2) +
          Math.random().toString(36).slice(2)
        );

        responseFrame = document.createElement('iframe');
        responseFrame.name = 'absensiResponseFrame';
        responseFrame.style.display = 'none';
        responseFrame.title = 'Respons pencatatan';
        document.body.appendChild(responseFrame);

        requestForm = document.createElement('form');
        requestForm.method = 'POST';
        requestForm.action = WEB_APP_URL;
        requestForm.target = '_top';
        requestForm.style.display = 'none';

        const fields = {
          token: token,
          pin: pinInput.value.trim(),
          nonce: requestNonce
        };

        for (const [name, value] of Object.entries(fields)) {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = name;
          input.value = value;
          requestForm.appendChild(input);
        }

        document.body.appendChild(requestForm);
        requestForm.submit();

        statusBox.textContent =
          'Permintaan dikirim. Menunggu hasil dari server...';

        timeoutId = setTimeout(() => {
          if (!requestNonce) return;

          bersihkanPermintaan();
          statusBox.textContent =
            'Belum menerima jawaban server. Periksa koneksi dan LogHaid sebelum mencoba lagi.';
          startBtn.textContent = 'Coba Lagi';
        }, 20000);

      } catch (err) {
        bersihkanPermintaan();
        statusBox.textContent =
          'Pengiriman gagal: ' + err.message;
        startBtn.textContent = 'Coba Lagi';
      }
    }

    startBtn.addEventListener('click', async () => {
      if (running || processing) return;

      if (!pinInput.value.trim()) {
        statusBox.textContent = 'Masukkan PIN petugas dahulu.';
        pinInput.focus();
        return;
      }

      if (!navigator.mediaDevices?.getUserMedia) {
        statusBox.textContent =
          'Browser tidak mendukung akses kamera.';
        return;
      }

      try {
        startBtn.disabled = true;
        statusBox.textContent = 'Meminta izin kamera...';

        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 230, height: 230 } },
          async (token) => {
            if (processing) return;
            await kirimAbsensi(token);
          },
          () => {}
        );

        running = true;
        startBtn.disabled = false;
        statusBox.textContent =
          'Kamera aktif. Arahkan QR ke kotak pemindai.';
      } catch (err) {
        running = false;
        startBtn.disabled = false;
        statusBox.textContent =
          'Kamera gagal dibuka: ' + err.name +
          ' — ' + err.message;
      }
    });
  </script>
</body>
</html>
