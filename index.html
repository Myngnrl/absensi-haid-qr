
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi Haid Digital</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 24px auto;
      padding: 16px;
      background: #f5f7fb;
      color: #222;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 2px 12px #0001;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      border: 1px solid #bbb;
    }
    button {
      border: 0;
      background: #176b45;
      color: white;
      cursor: pointer;
    }
    #reader {
      width: 100%;
      margin-top: 16px;
    }
    #status {
      margin-top: 16px;
      padding: 12px;
      background: #eef3f0;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Absensi Haid Digital</h2>
    <p>Masukkan PIN petugas, lalu pindai QR siswi.</p>

    <label for="pin">PIN Petugas</label>
    <input id="pin" type="password"
      inputmode="numeric" autocomplete="off"
      placeholder="Masukkan PIN petugas">

    <button id="startBtn">Buka Kamera</button>
    <div id="reader"></div>
    <div id="status" role="status" aria-live="polite">
      Kamera belum dibuka.
    </div>
  </div>

  <script>
    // Ganti alamat di bawah dengan Web app URL milikmu.
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyMDHp0R61Az23eiMjSjLP_tviHFkGkD6y4d0pY3HUO-gOvVptpYPPVQKpm5e8DBdd3hw/exec';

    let scanner = null;
    let running = false;
    let processing = false;

    const statusBox = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const pinInput = document.getElementById('pin');

    startBtn.addEventListener('click', async () => {
      if (running || processing) return;

      if (WEB_APP_URL === 'TEMPEL_WEB_APP_URL_DI_SINI') {
        statusBox.textContent =
          'Alamat Web App belum diisi di kode.';
        return;
      }

      if (!pinInput.value.trim()) {
        statusBox.textContent = 'Masukkan PIN petugas dahulu.';
        pinInput.focus();
        return;
      }

      if (!navigator.mediaDevices?.getUserMedia) {
        statusBox.textContent =
          'Browser tidak mendukung akses kamera.';
        return;
      }

      try {
        statusBox.textContent = 'Meminta izin kamera...';

        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 230, height: 230 } },
          async (token) => {
            if (processing) return;
            processing = true;

            statusBox.textContent =
              'QR terbaca. Mengirim permintaan pencatatan...';

            try {
              await scanner.stop();
              running = false;

              // Mengirim token dan PIN tanpa membaca respons server.
              // Hasil akhirnya harus diperiksa di Google Sheets.
              await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                  'Content-Type':
                    'application/x-www-form-urlencoded;charset=UTF-8'
                },
                body: new URLSearchParams({
                  token: token,
                  pin: pinInput.value.trim()
                })
              });

              statusBox.textContent =
                'Permintaan dikirim. Periksa sheet LogHaid ' +
                'untuk memastikan pencatatan berhasil.';
              startBtn.textContent = 'Pindai QR Berikutnya';
            } catch (err) {
              statusBox.textContent =
                'Pengiriman bermasalah. Periksa koneksi dan coba lagi.';
              startBtn.textContent = 'Coba Lagi';
            } finally {
              processing = false;
            }
          },
          () => {}
        );

        running = true;
        statusBox.textContent =
          'Kamera aktif. Arahkan QR ke kotak pemindai.';
      } catch (err) {
        statusBox.textContent =
          'Kamera gagal dibuka: ' + err.name +
          ' — ' + err.message;
        running = false;
      }
    });
  </script>
</body>
</html>
